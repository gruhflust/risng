# RISng PXE kickstart for RIS 7.0-00 (LP3 iCAS_PhII, RHEL 9.6)
#
# Base: RIS7 ISO ks.cfg (products/iCAS_PhII/ks.cfg), adapted for PXE:
#   - rootpw --lock (the secret hash from the ISO is NOT replicated;
#     see docs/requirements/information/RIS7-Rollen-Spec.md section 8)
#   - %include /tmp/repos.cfg stays active: the LP3 pre-script generates
#     /tmp/repos.cfg itself from lp_settings.json + detected base URL
#   - DIS server integration: ks.cfg %pre detects a DIS server at the
#     base URL automatically; without one it continues silently
#   - stage1.sh bootstrap, %post stage2 setup unchanged (black-box ELFs)
#
# Boot options (see bootentry templates):
#   inst.stage2=http://<tftp>/ris/7.0  inst.repo=http://<tftp>/ris/7.0
#   ks=http://<tftp>/kickstart/ris7.cfg  lp.product=iCAS_PhII
#
#version=RHEL9
install
text
lang en_US.UTF-8
keyboard de
timezone UTC
authselect select minimal
rootpw --lock

# workaround for functionality missing in stage1
# (LP3 pre-script generates /tmp/repos.cfg from lp_settings.json)
%include /tmp/repos.cfg

# Packages
%packages
@base
poco-foundation
poco-util
poco-xml
poco-json
poco-net
poco-encodings
python-netsnmpagent
puppet-agent
plattform-tools
-dracut-config-rescue
%end

# Pre-script
# --erroronfail: Display an error and halt the installation if the script
#                fails. The error message will direct you to where the cause
#                of the failure is logged.
# The shell script runs with 'set -e' and will therefore stop and return
# nonzero if an error occurs.
%pre --erroronfail
#!/bin/bash
set -e
set -x
STAGE1_DIR="stage1/"
STAGE1_SHAR="stage1.sh"
DVD_MOUNTPOINT="/run/install/repo"
TMPDIR="/tmp"

# workaround for functionality missing in stage1
PLATTFORM_REPO="components/plattform/repository"
PLATTFORM_DRIVER_REPO="components/plattform/drivers"
PRODUCTS_REPO="components/products/repository"
OS_UPDATES_REPO="components/os-updates"

# - For all key/value (option) pairs of kernel parameters in /proc/cmdline,
# grep option which matches ks= or inst.ks=
# - If the matched option (key/value pair) contains inst. remove it.
for option in $(< /proc/cmdline) ; do
    if egrep -q '^(inst\.|)ks=' <<<$option ; then
                KS="${option#inst.}"
    fi
done
echo >&2 "KS option: '$KS'"

case "$KS" in
ks=http://*)
	BASEURL=$(sed -r 's,ks=(http://.+)/ks.cfg,\1,' <<<"${KS}")

	MACADDR=$(cat /proc/cmdline | sed -e 's/^.*BOOTIF=01-//' -e 's/ .*$//'|tr '-' ':')
	DISURL=$(sed 's|\(http://[^/]*/\).*|\1|g' <<<"${BASEURL}")
	MEDIUMNAME=$(sed 's|^http://.*/\([^/].*\)/[^/].*$|\1|g' <<<"${BASEURL}")

	#save the DISURL for future curl calls to the disserver webservice
	if [ -n "$DISURL" ]; then
		# use curl to get the http response code: 200 means success and thus identifies a disserver because ${DISURL}/dis/ should only be valid on a disserver
		if [ 200 -eq $(curl -s -o /dev/null -w %{http_code} ${DISURL}/dis/) ]; then
			echo >&2 "DISSERVER detected: $DISURL"
			echo ${DISURL} > /tmp/DISURL
			#register the machine to the disserver

			MACHINEID=$(curl -s -F "command=getMachineId" -F "macaddr=${MACADDR}" ${DISURL}/dis/| /usr/libexec/platform-python -c "import sys, json; print(json.load(sys.stdin)['id'])" || echo "")
			if [ -z "$MACHINEID" ]; then
		     		MACHINEID=$(curl -s -F "command=addMachine" -F "keys=macaddr\=${MACADDR}" ${DISURL}/dis/| /usr/libexec/platform-python -c "import sys, json; print(json.load(sys.stdin)['id'])"|| echo "")
			fi
			echo ${MACHINEID} > /tmp/MACHINEID
			if [ -n "$MACHINEID" ]; then
				curl -s --data "command=updateMachine&data={\"id\": \"${MACHINEID}\", \"stage\": \"install\", \"progress\": \"5\" }" ${DISURL}/dis/
			fi
			export DISURL
			export MACHINEID
		else
			echo >&2 "DISSERVER not detected"
		fi
	fi

	STAGE1="${BASEURL}/${STAGE1_DIR}${STAGE1_SHAR}"
	SETUP_TAR="${BASEURL}/setup.tar.xz"
	LOG_POLL="${BASEURL}/logPoll.sh"
	OS_UPDATES_DIR="${BASEURL}/${OS_UPDATES_REPO}"
	echo >&2 "Fetching ${STAGE1}"
	wget ${STAGE1} --retry-connrefused -O ${TMPDIR}/${STAGE1_SHAR}
	wget ${SETUP_TAR} --retry-connrefused -O ${TMPDIR}/setup.tar.xz
	wget "${OS_UPDATES_DIR}/.present" --retry-connrefused -O "${TMPDIR}/os-updates.try" && mv "${TMPDIR}/os-updates.try" "${TMPDIR}/os-updates.present"

	# workaround for functionality missing in stage1
	REPOURL="${BASEURL}/${PLATTFORM_REPO}"
	DRIVERURL="${BASEURL}/${PLATTFORM_DRIVER_REPO}"
	PRODUCTREPOURL="${BASEURL}/${PRODUCTS_REPO}"
	OS_UPDATES_REPO_URL="${BASEURL}/${OS_UPDATES_REPO}"

	#start the logfile poll to update the DIS Server Progressbar
	wget ${LOG_POLL} --retry-connrefused -O ${TMPDIR}/logPoll.sh
	chmod +x ${TMPDIR}/logPoll.sh
	${TMPDIR}/logPoll.sh &>/dev/null &
	disown
	;;
ks=cdrom:/*|ks=hd:*)
	STAGE1="${DVD_MOUNTPOINT}/${STAGE1_DIR}${STAGE1_SHAR}"
	OS_UPDATES_DIR="${DVD_MOUNTPOINT}/${OS_UPDATES_REPO}"
	echo >&2 "Fetching ${STAGE1}"
	cp ${STAGE1} ${TMPDIR}/${STAGE1_SHAR}
	cp "${DVD_MOUNTPOINT}/setup.tar.xz" ${TMPDIR}
	# workaround for functionality missing in stage1
	BASEURL="file://${DVD_MOUNTPOINT}"
	REPOURL="${BASEURL}/${PLATTFORM_REPO}"
	DRIVERURL="${BASEURL}/${PLATTFORM_DRIVER_REPO}"
	PRODUCTREPOURL="${BASEURL}/${PRODUCTS_REPO}"
	OS_UPDATES_REPO_URL="${BASEURL}/${OS_UPDATES_REPO}"
	;;
*)
	echo >&2 "Error: Invalid ks option: '${KS}'"
	exit 1
	;;
esac

echo ${BASEURL} > /tmp/BASEURL

# Save the MEDIUMNAME
if [ -n "$MEDIUMNAME" ]; then
	echo >&2 "MEDIUMNAME detected: $MEDIUMNAME"
	echo ${MEDIUMNAME} > /tmp/MEDIUMNAME
fi

# Change Terminal to ensure the Selector works
exec < /dev/tty6 > /dev/tty6
chvt 6

chmod +x ${TMPDIR}/${STAGE1_SHAR}
cd /
${TMPDIR}/${STAGE1_SHAR}

# Switch back to terminal 1
chvt 1
exec < /dev/tty1 > /dev/tty1

# get the current slot number
if [ -f /tmp/SLOTNO ]; then
	SLOTNO=$(cat /tmp/SLOTNO)
	if [ -f /etc/rsyslog.d/log_to_dis.conf ]; then
		sed -i "s/slotno=[0-9]\{1,\}/slotno=$SLOTNO/g" /etc/rsyslog.d/log_to_dis.conf
		systemctl restart rsyslog.service
	fi
fi

# Providing and importing LinuxPlattform GPG Key
rpm --import RPM-GPG-KEY-LinuxPlattform-3

# Workaround for anaconda failing to configure the repositories in the
# installed system

%end

%include /tmp/partition

# Post-script
# --erroronfail: Display an error and halt the installation if the script
#                fails. The error message will direct you to where the cause
#                of the failure is logged.
# The shell script runs with 'set -e' and will therefore stop and return
# nonzero if an error occurs.
%post --nochroot --erroronfail
#!/bin/bash
set -e
set -x
#prepare chroot mount points
NEWROOT=/var/lib/plattform/mnt/setup
mkdir -p $NEWROOT
#find the setup root partition
mount `blkid -L setup` $NEWROOT
mkdir -p $NEWROOT/{dev,sys,proc,run,mnt/sysimage,tmp}

#test if the setup partition has a plattform in it
if [ ! -d $NEWROOT/var/lib/plattform ]; then
        pushd $NEWROOT >/dev/null && xzcat /tmp/setup.tar.xz | tar -xf -
        popd >/dev/null
fi

#get the DISURL and the Machine-ID in DIS Server Mode
if [ -f /tmp/DISURL ]; then
   DISURL=$(cat /tmp/DISURL)
fi

if [ -f /tmp/MACHINEID ]; then
   MACHINEID=$(cat /tmp/MACHINEID)
fi

cd /
LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:./stage1lib /post-script 2>&1

# copy the stage2 binary to the installed system
cp /stage2 /mnt/sysimage/stage2

# disable login prompt on current tty for stage 2
mkdir -p /mnt/sysimage/etc/systemd/system/getty@tty1.service.d
echo "[Unit]" > /mnt/sysimage/etc/systemd/system/getty@tty1.service.d/condition-path.conf
echo "ConditionPathExists=!/etc/no-login-prompt" >> /mnt/sysimage/etc/systemd/system/getty@tty1.service.d/condition-path.conf
touch /mnt/sysimage/etc/no-login-prompt

# install the stage2 mock-up script to the installed system
cat >/mnt/sysimage/stage2.sh <<'EOF'
#!/bin/bash
function banner() {
       clear
       cat << "BANNER"
 _     _                       _____  _       _   _    __
| |   (_)                     |  __ \| |     | | | |  / _|
| |    _ _ __  _   ___  ______| |__) | | __ _| |_| |_| |_ ___  _ __ _ __ ___
| |   | |  _ \| | | \ \/ /____|  ___/| |/ _  | __| __|  _/ _ \|  __|  _   _ \
| |___| | | | | |_| |>  <     | |    | | (_| | |_| |_| || (_) | |  | | | | |
|_____|_|_| |_|\__,_/_/\_\    |_|    |_|\__ _|\__|\__|_| \___/|_|  |_| |_| |_|
BANNER
}

banner

echo -n "Delaying stage2 by 10 sec for circumventing network hiccups ... "
sleep 10

cd /
/stage2 2>&1 | tee -a /var/log/plattform/plattform.log
EOF

chmod +x /mnt/sysimage/stage2.sh

# SELinux for systemd EXEC
chcon -t bin_t /mnt/sysimage/stage2.sh /mnt/sysimage/stage2

# install and enable the LinuxPlattformStage2 service
mkdir -p /mnt/sysimage/usr/lib/systemd/system
cat >/mnt/sysimage/usr/lib/systemd/system/LinuxPlattformStage2.service <<EOF
[Unit]
Description=LinuxPlattformStage2
After=getty@tty1.service network-online.target
ConditionPathExists=/LinuxPlattformStage2

[Service]
Type=oneshot
ExecStart=/stage2.sh
ExecStartPost=/usr/bin/rm -f /LinuxPlattformStage2
#restore login prompt
ExecStartPost=/usr/bin/rm -f /etc/no-login-prompt
ExecStartPost=/usr/bin/rm -f /etc/systemd/system/getty@tty1.service.d/condition-path.conf
ExecStartPost=/sbin/reboot
StandardInput=tty
StandardOutput=tty
TTYPath=/dev/tty1
TTYReset=yes
TTYVHangup=yes

[Install]
WantedBy=default.target
EOF
chroot /mnt/sysimage systemctl enable LinuxPlattformStage2.service
touch /mnt/sysimage/LinuxPlattformStage2

# Copy LinuxPlattform GPG Key to installed machine
cp RPM-GPG-KEY-LinuxPlattform-3 /mnt/sysimage/etc/pki/rpm-gpg/RPM-GPG-KEY-LinuxPlattform-3
chroot /mnt/sysimage rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-LinuxPlattform-3

# If we have an log_to_dis config, copy it for stage2
if [ -f /etc/rsyslog.d/log_to_dis.conf ]; then
	cp /etc/rsyslog.d/log_to_dis.conf /mnt/sysimage/etc/rsyslog.d/
fi

#copy DISURL to the Setup Partition
if [ -f /tmp/DISURL ]; then
	cp -a /tmp/DISURL $NEWROOT/var/lib/plattform
fi

#copy MachineID to the Setup Partition
if [ -f /tmp/MACHINEID ]; then
	cp -a /tmp/MACHINEID $NEWROOT/var/lib/plattform
fi

# Set bootmethod to harddisk before reboot
if [ -n "$MACHINEID" ]; then
	curl -s --data "command=updateMachine&data={\"id\": \"${MACHINEID}\", \"bootmethod\": \"harddisk\"}" ${DISURL}/dis/

fi

%end

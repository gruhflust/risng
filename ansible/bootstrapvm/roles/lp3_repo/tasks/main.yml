---
# lp3_repo | Publish LP3 platform + iCAS product repos (RIS8 phase 2 source).
# Source is an OPERATOR-STAGED tree (no ISO on the host, by design):
#   <lp3_repo_staging_root>/plattform/repository/
#   <lp3_repo_staging_root>/products/repository/
# Only these two component repos (~580 MB) are published. Puppet RPMs are
# rejected. No ISO download, no ISO mount, no full-ISO extraction.

- name: lp3_repo | Ensure publish root exists
  ansible.builtin.file:
    path: "{{ lp3_repo_root }}"
    state: directory
    mode: "0755"

- name: lp3_repo | Probe operator-staged LP3 source tree
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ lp3_repo_staging_root }}/plattform/repository"
    - "{{ lp3_repo_staging_root }}/products/repository"
  register: lp3_src_probe

- name: lp3_repo | Fail when no staged LP3 source is available
  ansible.builtin.assert:
    that:
      - lp3_src_probe.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      No staged LP3 source tree found at {{ lp3_repo_staging_root }}.
      Stage the LP3 component repos out-of-band (from the mounted LP3/RIS7
      ISO on the build VM): copy components/plattform/repository and
      components/products/repository into {{ lp3_repo_staging_root }} as
      plattform/repository and products/repository (exclude puppet-*.rpm),
      then re-run with -e lp3_repo_enabled=true.

# ---------------------------------------------------------------------------
# Probe published artifacts to decide whether a rebuild is needed.
# ---------------------------------------------------------------------------
- name: lp3_repo | Probe published LP3 artifacts
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ lp3_repo_root }}/plattform/repository/repodata/repomd.xml"
    - "{{ lp3_repo_root }}/products/repository/repodata/repomd.xml"
  register: lp3_pub_probe

- name: lp3_repo | Determine whether the LP3 publish is required
  ansible.builtin.set_fact:
    lp3_needs_rebuild: >-
      {{
        (lp3_repo_rebuild_always | bool)
        or ((lp3_pub_probe.results | rejectattr('stat.exists') | list | length) > 0)
      }}

# ---------------------------------------------------------------------------
# Publish plattform + products component repos (Puppet RPMs rejected).
# ---------------------------------------------------------------------------
- name: lp3_repo | Publish LP3 plattform component repo
  ansible.builtin.command:
    argv:
      - rsync
      - "-a"
      - "--mkpath"
      - "{{ lp3_repo_staging_root }}/plattform/repository/"
      - "{{ lp3_repo_root }}/plattform/repository/"
  when: lp3_needs_rebuild | bool

- name: lp3_repo | Publish LP3 products component repo
  ansible.builtin.command:
    argv:
      - rsync
      - "-a"
      - "--mkpath"
      - "{{ lp3_repo_staging_root }}/products/repository/"
      - "{{ lp3_repo_root }}/products/repository/"
  when: lp3_needs_rebuild | bool

- name: lp3_repo | Validate published LP3 repo tree
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ lp3_repo_root }}/plattform/repository/repodata/repomd.xml"
    - "{{ lp3_repo_root }}/products/repository/repodata/repomd.xml"
  register: lp3_pub_validate

- name: lp3_repo | Fail when published LP3 tree is incomplete
  ansible.builtin.assert:
    that:
      - lp3_pub_validate.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: "Published LP3 repo tree is incomplete under {{ lp3_repo_root }}."

- name: lp3_repo | Confirm Puppet RPMs were not published (Puppet is forbidden)
  ansible.builtin.shell:
    cmd: find {{ lp3_repo_root }} -name 'puppet-*.rpm' -print | head -n5
    executable: /bin/bash
  register: lp3_puppet_leftovers
  changed_when: false

- name: lp3_repo | Fail when any Puppet RPM leaked into the published tree
  ansible.builtin.fail:
    msg: "Puppet RPMs found in published LP3 tree: {{ lp3_puppet_leftovers.stdout }}"
  when: lp3_puppet_leftovers.stdout | default('') | trim | length > 0

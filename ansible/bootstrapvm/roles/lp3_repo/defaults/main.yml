---
# lp3_repo | Publish LP3 platform + iCAS product RPM repos for RIS8 phase 2.
# Source: operator-supplied LP3 ISO (never downloaded / not stored in Git).
# Strategy: only the two component repos (~580 MB) are published via rsync,
#   NOT the full 14 GB ISO, NOT setup.tar.xz, NOT the RHEL base.
# Puppet is forbidden in RIS8; the puppet-agent RPM is dropped from the
# published tree (nothing else in the LP3 set requires it - verified).
lp3_repo_enabled: true

# Source ISO. Two acceptable locations, in priority order (auto-detected):
#   1. lp3_repo_iso_path     - pre-staged ISO file (mounted read-only on demand)
#   2. lp3_repo_iso_mountpoint - an already-mounted read-only ISO dir
lp3_repo_iso_path: "{{ iso_download_dir }}/ris7.iso"
lp3_repo_iso_mountpoint: "{{ pxe_tmp_dir }}/lp3-iso"

# Components to publish (relative to ISO root).
lp3_repo_components:
  - "plattform"
  - "products"

# Published HTTP root (served by the existing nginx on the RISng host).
lp3_repo_relative: "lp3/icas_phii"
lp3_repo_root: "{{ pxe_tftp_dir }}/{{ lp3_repo_relative }}"

# Drop these RPM filenames from the published tree (Puppet is forbidden).
lp3_repo_drop_globs:
  - "puppet-agent-*.rpm"
  - "puppet-server-*.rpm"
  - "puppet-*.rpm"

# Rebuild flag.
lp3_repo_rebuild_always: false

# Phase-2 repo baseurls used by the installed Alma client (templated into
# /etc/yum.repos.d on the target).
lp3_repo_platform_baseurl: "http://{{ tftp_server_ip }}/{{ lp3_repo_relative }}/plattform/repository"
lp3_repo_products_baseurl:  "http://{{ tftp_server_ip }}/{{ lp3_repo_relative }}/products/repository"

# Basic platform packages installed in phase 2 (non-native Alma, from LP3).
lp3_phase2_packages:
  - "poco-foundation"
  - "poco-util"
  - "poco-xml"
  - "poco-json"
  - "poco-net"
  - "poco-encodings"
  - "plattform-tools"
  - "python-netsnmpagent"
  - "disserver"
  - "default-keys"

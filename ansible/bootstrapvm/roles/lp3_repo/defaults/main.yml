---
# lp3_repo | Publish LP3 platform + iCAS product RPM repos for RIS8 phase 2.
#
# IMPORTANT (2026-09-06):
# The LP3 source tree is OPERATOR-STAGED. The LP3/RIS7 ISO is an agent
# information source (mounts on the build VM only) and MUST NOT be a
# dependency of the Ansible pipeline: no ISO download, no ISO mount,
# no ISO path on the PXE host.
#
# Staging contract (done out-of-band, e.g. on the build VM from the
# mounted ISO):
#   <lp3_repo_staging_root>/
#     plattform/repository/   (RPMs + repodata)
#     products/repository/    (RPMs + repodata, no puppet-*.rpm)
# The role rsyncs that tree to the HTTP root and validates the result.
lp3_repo_enabled: false

# Operator-staged source tree (relative component repos, ISO-free).
lp3_repo_staging_root: "{{ pxe_tmp_dir }}/lp3-staging"

# Published HTTP root (served by the existing nginx on the RISng host).
lp3_repo_relative: "lp3/icas_phii"
lp3_repo_root: "{{ pxe_tftp_dir }}/{{ lp3_repo_relative }}"

# Rebuild flag.
lp3_repo_rebuild_always: false

# Phase-2 repo baseurls used by the installed Alma client (templated into
# /etc/yum.repos.d on the target).
lp3_repo_platform_baseurl: "http://{{ tftp_server_ip }}/{{ lp3_repo_relative }}/plattform/repository"
lp3_repo_products_baseurl:  "http://{{ tftp_server_ip }}/{{ lp3_repo_relative }}/products/repository"

# Basic platform packages installed in phase 2 (non-native Alma, from LP3).
lp3_phase2_packages:
  - "poco-foundation"
  - "poco-util"
  - "poco-xml"
  - "poco-json"
  - "poco-net"
  - "poco-encodings"
  - "plattform-tools"
  - "python-netsnmpagent"
  - "disserver"
  - "default-keys"

# risng_getisos_v01 – pre-download PXE ISO assets for risng setup
---
- name: Download risng PXE ISOs ahead of setup
  hosts: bootstrapvm
  become: true
  gather_facts: false

  vars_files:
    - ../host_vars/bootstrapvm.yml

  pre_tasks:
    - name: Recover stale system time before ISO downloads
      ansible.builtin.import_tasks: recover-system-time.yml

  tasks:
    - name: 00 Invoke management role to fetch ISO artifacts
      ansible.builtin.import_role:
        name: management
        tasks_from: 10_iso_downloads.yml

    - name: 01 Fetch the configured RHEL 9.8 installer ISO
      ansible.builtin.import_role:
        name: rhel98_install
        tasks_from: fetch_iso.yml
      when: rhel98_install_enabled | default(false) | bool

    - name: 02 Fetch the configured RIS7 (LP3 iCAS_PhII) installer ISO
      ansible.builtin.import_role:
        name: ris7_install
        tasks_from: fetch_iso.yml
      when: ris7_install_enabled | default(false) | bool

    - name: 03 Fetch the fixed AlmaLinux 9.8 installer ISO (RIS8 phase 1)
      ansible.builtin.import_role:
        name: almalinux98_install
        tasks_from: fetch_iso.yml
      when: almalinux98_install_enabled | default(true) | bool

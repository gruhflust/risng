# pnt_setup_v26  – 3-phase PXE setup: update → image build → PXE serve
###############################################################################
- name: 00 Initial phase  System update and DNS healing
  hosts: bootstrapvm
  become: true
  gather_facts: true   
  
  pre_tasks:
    - name: 00.00 Recover snapshot system time before apt/HTTPS (best effort)
      ansible.builtin.shell: |
        python3 - <<'PY'
        import email.utils
        import subprocess
        import time
        import urllib.request

        urls = [
            'http://deb.debian.org/debian',
            'http://security.debian.org/debian-security',
        ]
        max_drift_seconds = 300
        now = int(time.time())

        for url in urls:
            try:
                header = urllib.request.urlopen(url, timeout=10).headers.get('Date', '')
                if not header:
                    continue
                ts = int(email.utils.parsedate_to_datetime(header).timestamp())
                drift = abs(ts - now)
                print(f'reference={url} epoch={ts} drift_seconds={drift}')
                if drift > max_drift_seconds:
                    subprocess.run(['timedatectl', 'set-ntp', 'false'], check=False)
                    result = subprocess.run(['date', '-u', '-s', f'@{ts}'], check=False)
                    subprocess.run(['timedatectl', 'set-ntp', 'true'], check=False)
                    if result.returncode == 0:
                        print('changed=true')
                    else:
                        print(f'changed=false date_set_rc={result.returncode}')
                else:
                    subprocess.run(['timedatectl', 'set-ntp', 'true'], check=False)
                    print('changed=false')
                raise SystemExit(0)
            except Exception as exc:
                print(f'warning: {url}: {exc}')

        subprocess.run(['timedatectl', 'set-ntp', 'true'], check=False)
        print('changed=false no_reference_time_available')
        PY
      args:
        executable: /bin/bash
      register: snapshot_time_recovery
      changed_when: "'changed=true' in (snapshot_time_recovery.stdout | default(''))"
      failed_when: false

    - name: 00.00a Show current system time status
      ansible.builtin.shell: |
        timedatectl status || true
        echo '---'
        date -u
      args:
        executable: /bin/bash
      register: timedatectl_status
      changed_when: false
      failed_when: false

    - name: 00.00b Debug time status after snapshot recovery
      ansible.builtin.debug:
        msg:
          - "{{ snapshot_time_recovery.stdout_lines | default([]) }}"
          - "{{ timedatectl_status.stdout_lines | default([]) }}"

    - import_tasks: "{{ playbook_dir }}/detect_interfaces.yml"

    - name: 00.08 Ensure dedicated risng operator group exists (early)
      ansible.builtin.group:
        name: risng
        state: present

    - name: 00.08a Ensure dedicated risng operator user exists (early)
      ansible.builtin.user:
        name: risng
        group: risng
        shell: /bin/bash
        create_home: true
        state: present

    - name: 00.08b Ensure risng user password is set for local graphical login
      ansible.builtin.user:
        name: risng
        password: "{{ 'risng' | password_hash('sha512') }}"
        update_password: always

    - name: 00.08c Ensure risng is passwordless sudoer
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-risng
        owner: root
        group: root
        mode: "0440"
        content: |
          risng ALL=(ALL) NOPASSWD:ALL

    - name: 00.08d Check whether AccountsService is available
      ansible.builtin.stat:
        path: /var/lib/AccountsService
      register: risng_accountsservice_root
      changed_when: false

    - name: 00.08e Ensure AccountsService users directory exists
      ansible.builtin.file:
        path: /var/lib/AccountsService/users
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: risng_accountsservice_root.stat.exists | default(false)

    - name: 00.08f Ensure risng is visible on graphical login screen
      ansible.builtin.copy:
        dest: /var/lib/AccountsService/users/risng
        owner: root
        group: root
        mode: "0644"
        content: |
          [User]
          SystemAccount=false
          Hidden=false
          XSession=gnome
      when: risng_accountsservice_root.stat.exists | default(false)

    - name: 00.08g Ensure risng GNOME config directory exists
      ansible.builtin.file:
        path: /home/risng/.config
        state: directory
        owner: risng
        group: risng
        mode: "0755"

    - name: 00.08h Mark GNOME initial setup as done for risng
      ansible.builtin.file:
        path: /home/risng/.config/gnome-initial-setup-done
        state: touch
        owner: risng
        group: risng
        mode: "0644"

    - name: 00.09 Check whether minimal GNOME login stack is already present
      ansible.builtin.shell: |
        set -euo pipefail
        for pkg in gdm3 gnome-shell gnome-session gnome-terminal task-gnome-desktop dbus-x11 dconf-cli accountsservice xdg-user-dirs; do
          dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q "install ok installed" || exit 1
        done
      args:
        executable: /bin/bash
      register: risng_gnome_stack_check
      changed_when: false
      failed_when: false

    - name: 00.09a Stop packagekit early to avoid apt lock while installing graphics stack
      ansible.builtin.systemd:
        name: packagekit
        state: stopped
      failed_when: false

    - name: 00.09b Preseed gdm3 as default display manager before install
      ansible.builtin.debconf:
        name: gdm3
        question: shared/default-x-display-manager
        value: gdm3
        vtype: select
      when: risng_gnome_stack_check.rc != 0

    - name: 00.09c Install fast minimal GNOME login stack early (for local login UX)
      ansible.builtin.apt:
        name:
          - gdm3
          - gnome-shell
          - gnome-session
          - gnome-terminal
          - task-gnome-desktop
          - dbus-x11
          - dconf-cli
          - accountsservice
          - xdg-user-dirs
          - x11-xserver-utils
          - xserver-xorg
        state: present
        update_cache: true
        cache_valid_time: 86400
        lock_timeout: 120
        dpkg_options: force-confdef,force-confold
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: risng_gnome_stack_check.rc != 0

    - name: 00.09c1 Recheck AccountsService after GUI stack install
      ansible.builtin.stat:
        path: /var/lib/AccountsService
      register: risng_accountsservice_root
      changed_when: false

    - name: 00.09c2 Ensure AccountsService users directory exists after GUI stack install
      ansible.builtin.file:
        path: /var/lib/AccountsService/users
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: risng_accountsservice_root.stat.exists | default(false)

    - name: 00.09c3 Ensure risng is visible on graphical login screen after GUI stack install
      ansible.builtin.copy:
        dest: /var/lib/AccountsService/users/risng
        owner: root
        group: root
        mode: "0644"
        content: |
          [User]
          SystemAccount=false
          Hidden=false
          XSession=gnome
      when: risng_accountsservice_root.stat.exists | default(false)

    - name: 00.09c4 Ensure system dconf directories exist for graphical defaults
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/dconf/profile
        - /etc/dconf/db/local.d

    - name: 00.09d Ensure graphical.target is default
      ansible.builtin.command: systemctl set-default graphical.target
      changed_when: false

    - name: 00.09e Ensure gdm3 is enabled for graphical login after reboot
      ansible.builtin.systemd:
        name: gdm3
        enabled: true

    - name: 00.09ea Ensure display-manager.service points to gdm3
      ansible.builtin.file:
        src: /lib/systemd/system/gdm3.service
        dest: /etc/systemd/system/display-manager.service
        state: link
        force: true

    - name: 00.09eb Ensure graphical.target is the persistent default target
      ansible.builtin.file:
        src: /lib/systemd/system/graphical.target
        dest: /etc/systemd/system/default.target
        state: link
        force: true

    - name: 00.09ec Ensure graphical target wants directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/graphical.target.wants
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: 00.09ed Ensure graphical.target pulls in gdm3 after reboot
      ansible.builtin.file:
        src: /etc/systemd/system/display-manager.service
        dest: /etc/systemd/system/graphical.target.wants/display-manager.service
        state: link
        force: true

    - name: 00.09ee Reload systemd after graphical target link changes
      ansible.builtin.systemd:
        daemon_reload: true

    - name: 00.09ef Re-assert gdm3 enablement for reboot persistence
      ansible.builtin.systemd:
        name: gdm3
        enabled: true

    - name: 00.09eg Verify default target after configuration
      ansible.builtin.command: systemctl get-default
      register: risng_default_target
      changed_when: false

    - name: 00.09eh Fail if default target is not graphical.target
      ansible.builtin.fail:
        msg: "Expected default target graphical.target, got {{ risng_default_target.stdout | default('unknown') }}"
      when: (risng_default_target.stdout | default('')) != 'graphical.target'

    - name: 00.09ei Verify gdm3 enablement state
      ansible.builtin.command: systemctl is-enabled gdm3
      register: risng_gdm3_enabled_state
      changed_when: false

    - name: 00.09ej Fail if gdm3 is not enabled for boot
      ansible.builtin.fail:
        msg: "Expected gdm3 enabled for boot, got state={{ risng_gdm3_enabled_state.stdout | default('unknown') }}"
      when: (risng_gdm3_enabled_state.stdout | default('')) not in ['enabled', 'alias', 'static', 'indirect']

    - name: 00.09f Note about deferred graphical login activation
      ansible.builtin.debug:
        msg: >-
          gdm3 is enabled for boot, and display-manager.service is linked to gdm3.
          The risng user is prepared for local GNOME login.

    # moved earlier: risng group/user bootstrap
    # moved earlier: risng group/user bootstrap
    # moved earlier: risng password bootstrap
    # moved earlier: risng sudo bootstrap
    # moved earlier: AccountsService + GNOME initial-setup bootstrap for risng

    - name: 00.12 Ensure risng ~/.ssh directory exists
      ansible.builtin.file:
        path: /home/risng/.ssh
        state: directory
        owner: risng
        group: risng
        mode: "0700"

    - name: 00.12a Probe controlhost user private key candidates (remote)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "/home/{{ ansible_env.SUDO_USER | default('', true) }}/.ssh/id_ed25519"
        - "{{ ssh_user_home }}/.ssh/id_ed25519"
        - "/root/.ssh/id_ed25519"
      register: risng_operator_privkey_stats
      changed_when: false

    - name: 00.12b Pick first available controlhost private key path
      ansible.builtin.set_fact:
        risng_operator_privkey_path: "{{ (risng_operator_privkey_stats.results | selectattr('stat.exists', 'equalto', true) | map(attribute='item') | list | first) | default('') }}"

    - name: 00.12c Copy controlhost SSH private key to risng user (if available)
      ansible.builtin.copy:
        src: "{{ risng_operator_privkey_path }}"
        dest: /home/risng/.ssh/id_ed25519
        remote_src: true
        owner: risng
        group: risng
        mode: "0600"
      when: (risng_operator_privkey_path | default('') | length) > 0

    - name: 00.12d Copy matching controlhost SSH public key to risng user (if available)
      ansible.builtin.copy:
        src: "{{ risng_operator_privkey_path }}.pub"
        dest: /home/risng/.ssh/id_ed25519.pub
        remote_src: true
        owner: risng
        group: risng
        mode: "0644"
      when: (risng_operator_privkey_path | default('') | length) > 0

    - name: 00.12e Ensure risng SSH keypair exists on staging host (fallback generation)
      ansible.builtin.command: >-
        sudo -u risng -H bash -lc 'test -s /home/risng/.ssh/id_ed25519 && test -s /home/risng/.ssh/id_ed25519.pub || ssh-keygen -t ed25519 -a 100 -N "" -f /home/risng/.ssh/id_ed25519'
      changed_when: true

    - name: 00.13 Probe bootstrap invoker SSH public key candidates (controller context)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ ssh_user_home }}/.ssh/id_ed25519.pub"
        - "{{ ssh_user_home }}/.ssh/id_rsa.pub"
        - "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/id_ed25519.pub"
        - "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/id_rsa.pub"
        - "/root/.ssh/id_ed25519.pub"
        - "/root/.ssh/id_rsa.pub"
      register: risng_operator_pubkey_stats
      changed_when: false
      delegate_to: localhost
      become: false

    - name: 00.14 Read first available bootstrap invoker SSH public key
      ansible.builtin.slurp:
        src: "{{ (risng_operator_pubkey_stats.results | selectattr('stat.exists', 'equalto', true) | map(attribute='item') | list | first) }}"
      register: risng_operator_pubkey_raw
      when: (risng_operator_pubkey_stats.results | selectattr('stat.exists', 'equalto', true) | list | length) > 0
      no_log: true
      delegate_to: localhost
      become: false

    - name: 00.15 Authorize bootstrap invoker SSH key for risng user
      ansible.posix.authorized_key:
        user: risng
        key: "{{ risng_operator_pubkey_raw.content | b64decode | trim }}"
        state: present
      when:
        - risng_operator_pubkey_raw is defined
        - risng_operator_pubkey_raw.content is defined

    - name: 00.15a Fallback authorize risng self key when invoker key is missing
      ansible.builtin.shell: |
        set -euo pipefail
        cat /home/risng/.ssh/id_ed25519.pub >> /home/risng/.ssh/authorized_keys
        sort -u /home/risng/.ssh/authorized_keys -o /home/risng/.ssh/authorized_keys
        chown risng:risng /home/risng/.ssh/authorized_keys
        chmod 600 /home/risng/.ssh/authorized_keys
      args:
        executable: /bin/bash
      when: risng_operator_pubkey_raw is not defined or risng_operator_pubkey_raw.content is not defined

    - name: 00.15b Warn when bootstrap invoker SSH key was not found (self-key fallback used)
      ansible.builtin.debug:
        msg: >-
          No readable bootstrap invoker SSH public key found; used /home/risng/.ssh/id_ed25519.pub fallback in authorized_keys.
      when: risng_operator_pubkey_raw is not defined or risng_operator_pubkey_raw.content is not defined

    - name: 00.16 Set RISng checkout root from running playbook
      ansible.builtin.set_fact:
        risng_checkout_root: "{{ playbook_dir }}/../.."
        risng_checkout_bashrc_template_path: "{{ playbook_dir }}/roles/management/templates/bashrc.j2"

    - name: 00.17 Probe running RISng checkout
      ansible.builtin.stat:
        path: "{{ risng_checkout_root }}/ansible/bootstrapvm/risng-setup.yml"
      register: risng_checkout_setup_stat
      changed_when: false

    - name: 00.18 Fail when running RISng checkout cannot be resolved
      ansible.builtin.fail:
        msg: "No RISng checkout found at {{ risng_checkout_root }} from playbook_dir={{ playbook_dir }}"
      when: not (risng_checkout_setup_stat.stat.exists | default(false))

    - name: 00.21a Inspect /home/risng/risng path state
      ansible.builtin.stat:
        path: /home/risng/risng
        follow: false
      register: risng_home_link_target

    - name: 00.21aa List existing /home/risng/risng directory entries (when not symlink)
      ansible.builtin.find:
        paths: /home/risng/risng
        file_type: any
        hidden: true
        recurse: false
      register: risng_home_link_target_entries
      when:
        - risng_home_link_target.stat.exists | default(false)
        - risng_home_link_target.stat.isdir | default(false)
        - not (risng_home_link_target.stat.islnk | default(false))

    - name: 00.21ab Remove empty legacy /home/risng/risng directory before symlink conversion
      ansible.builtin.file:
        path: /home/risng/risng
        state: absent
      when:
        - risng_home_link_target.stat.exists | default(false)
        - risng_home_link_target.stat.isdir | default(false)
        - not (risng_home_link_target.stat.islnk | default(false))
        - (risng_home_link_target_entries.files | default([]) | length) == 0

    - name: 00.21ac Ensure /home/risng/risng symlink points to running RISng checkout
      ansible.builtin.file:
        src: "{{ risng_checkout_root }}"
        dest: /home/risng/risng
        owner: risng
        group: risng
        state: link
        force: true
      when: >-
        not (
          (risng_home_link_target.stat.exists | default(false))
          and (risng_home_link_target.stat.isdir | default(false))
          and not (risng_home_link_target.stat.islnk | default(false))
          and ((risng_home_link_target_entries.files | default([]) | length) > 0)
        )

    - name: 00.21ad Keep existing non-empty /home/risng/risng directory (skip symlink conversion)
      ansible.builtin.debug:
        msg: >-
          Keeping existing non-empty directory /home/risng/risng as-is to avoid destructive conversion.
          Symlink conversion is skipped for this run.
      when:
        - risng_home_link_target.stat.exists | default(false)
        - risng_home_link_target.stat.isdir | default(false)
        - not (risng_home_link_target.stat.islnk | default(false))
        - (risng_home_link_target_entries.files | default([]) | length) > 0

    - name: 00.22 Build candidate paths for RISng management bashrc template
      ansible.builtin.set_fact:
        risng_management_bashrc_template_candidates:
          - "{{ risng_checkout_bashrc_template_path }}"
          - /home/risng/risng/ansible/bootstrapvm/roles/management/templates/bashrc.j2

    - name: 00.22a Probe RISng management bashrc template candidates
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ risng_management_bashrc_template_candidates }}"
      register: risng_management_bashrc_template_stats
      changed_when: false

    - name: 00.22b Pick first existing RISng management bashrc template
      ansible.builtin.set_fact:
        risng_management_bashrc_template_path: "{{ (risng_management_bashrc_template_stats.results | selectattr('stat.exists', 'defined') | selectattr('stat.exists', 'equalto', true) | map(attribute='item') | list | first) | default('') }}"

    - name: 00.22c Fail when no RISng management bashrc template was found
      ansible.builtin.fail:
        msg: "No RISng management bashrc template found; checked={{ risng_management_bashrc_template_candidates | join(', ') }}"
      when: (risng_management_bashrc_template_path | default('') | length) == 0

    - name: 00.22d Ensure risng .bashrc links to RISng management template
      ansible.builtin.file:
        src: "{{ risng_management_bashrc_template_path }}"
        dest: /home/risng/.bashrc
        owner: risng
        group: risng
        state: link
        force: true

    - name: 00.23 Ensure risng .bash_profile sources .bashrc
      ansible.builtin.copy:
        dest: /home/risng/.bash_profile
        owner: risng
        group: risng
        mode: "0644"
        content: |
          # managed by risng-setup
          if [ -f "$HOME/.bashrc" ]; then
            . "$HOME/.bashrc"
          fi

    - name: 00.24 Debug RISng user bootstrap summary
      ansible.builtin.debug:
        msg:
          - "RISng effective ssh_user={{ ssh_user }} ssh_user_home={{ ssh_user_home }}"
          - "RISng checkout root={{ risng_checkout_root | default('UNRESOLVED') }}"
          - "RISng bashrc link=/home/risng/.bashrc -> {{ risng_management_bashrc_template_path | default('UNRESOLVED') }}"


  vars_files:
    - ../host_vars/bootstrapvm.yml

  roles:
    - systemupdate

###############################################################################
- name: 01 Online phase  Build PXE export (internet mode)
  hosts: bootstrapvm
  become: true
  vars_files:
    - ../host_vars/bootstrapvm.yml

  pre_tasks:
    - import_tasks: detect_interfaces.yml

    - name: 01.01 Bring up WAN NIC and disable PXE NIC
      shell: |
        ip link set {{ internetinterface }} up
        ip addr flush dev {{ risng_lan_interface }} || true
        ip link set {{ risng_lan_interface }} down || true
      args:
        executable: /bin/bash

  roles:
    - management
    - tools
    - webserver
    - gopass
    # - debian-live
    # - netinstall
    - risng
    - risng_install

  post_tasks:
    - name: 01.99 Build feuer artifact checklist
      ansible.builtin.set_fact:
        risng_feuer_artifact_paths:
          - path: "{{ risng_target | default((pxe_tftp_dir | default('/var/lib/tftpboot')) ~ '/images/risng') }}/filesystem.squashfs"
            label: "Live-RIS squashfs (boot option 1)"
          - path: "{{ risng_target | default((pxe_tftp_dir | default('/var/lib/tftpboot')) ~ '/images/risng') }}/vmlinuz"
            label: "Live-RIS kernel"
          - path: "{{ risng_target | default((pxe_tftp_dir | default('/var/lib/tftpboot')) ~ '/images/risng') }}/initrd.img"
            label: "Live-RIS initrd"
          - path: "{{ spec_repo_root | default((pxe_tftp_dir | default('/var/lib/tftpboot')) ~ '/centos/7/os/x86_64') }}/LiveOS/squashfs.img"
            label: "CentOS installer stage2 squashfs"
          - path: "{{ spec_repo_root | default((pxe_tftp_dir | default('/var/lib/tftpboot')) ~ '/centos/7/os/x86_64') }}/images/pxeboot/vmlinuz"
            label: "CentOS installer kernel"
          - path: "{{ spec_repo_root | default((pxe_tftp_dir | default('/var/lib/tftpboot')) ~ '/centos/7/os/x86_64') }}/images/pxeboot/initrd.img"
            label: "CentOS installer initrd"

    - name: 01.99a Collect feuer artifact stats
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ risng_feuer_artifact_paths }}"
      register: risng_feuer_artifact_stats
      changed_when: false

    - name: 01.99b Print feuer artifact summary
      ansible.builtin.debug:
        msg: >-
          {{ item.item.label }} => {{ item.stat.path }} |
          exists={{ item.stat.exists | default(false) }} |
          size={{ item.stat.size | default(0) }}
      loop: "{{ risng_feuer_artifact_stats.results }}"

#
###############################################################################
- name: 02 Offline phase  Serve PXE (DHCP/DNS/TFTP)
  hosts: bootstrapvm
  become: true
  vars_files:
    - ../host_vars/bootstrapvm.yml

  pre_tasks:
    - import_tasks: "{{ playbook_dir }}/detect_interfaces.yml"

    - name: 02.01 bring up PXE NIC with static IP
      shell: |
        ip addr flush dev {{ risng_lan_interface }} || true
        ip addr add {{ dhcp_gateway }}/{{ dhcp_prefix }} dev {{ risng_lan_interface }}
        ip link set {{ risng_lan_interface }} up
      args:
        executable: /bin/bash
  
  #  - name: 02.01 Deactivate WAN and bring up PXE NIC with static IP
  #    shell: |
  #      ip link set {{ internetinterface }} down || true
  #      ip addr flush dev {{ risng_lan_interface }} || true
  #      ip addr add {{ dhcp_gateway }}/{{ dhcp_prefix }} dev {{ risng_lan_interface }}
  #      ip link set {{ risng_lan_interface }} up
  #    args:
  #      executable: /bin/bash



  roles:
    - pxe_assemble
    - dns
    - dhcp

  post_tasks:
    - import_role:
        name: management
        tasks_from: 20_persist_network.yml   # ensures NIC config survives reboot
    - name: 02.97 Build candidate paths for final risng .bashrc template
      ansible.builtin.set_fact:
        risng_final_bashrc_template_candidates:
          - "{{ playbook_dir }}/roles/management/templates/bashrc.j2"
          - "{{ ssh_user_home }}/risng/ansible/bootstrapvm/roles/management/templates/bashrc.j2"

    - name: 02.97a Probe final risng .bashrc template candidates
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ risng_final_bashrc_template_candidates }}"
      register: risng_final_bashrc_template_stats
      changed_when: false

    - name: 02.97b Pick first existing final risng .bashrc template
      ansible.builtin.set_fact:
        risng_final_bashrc_template_path: "{{ (risng_final_bashrc_template_stats.results | selectattr('stat.exists', 'defined') | selectattr('stat.exists', 'equalto', true) | map(attribute='item') | list | first) | default('') }}"

    - name: 02.97c Fail when no final risng .bashrc template was found
      ansible.builtin.fail:
        msg: "No final RISng bashrc template found; checked={{ risng_final_bashrc_template_candidates | join(', ') }}"
      when: (risng_final_bashrc_template_path | default('') | length) == 0

    - name: 02.97d Replace risng .bashrc with symlink to management template
      ansible.builtin.file:
        src: "{{ risng_final_bashrc_template_path }}"
        dest: "{{ ssh_user_home }}/.bashrc"
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        state: link
        force: true

    - name: 02.98 Ensure risng wallpaper directory exists
      ansible.builtin.file:
        path: "{{ ssh_user_home }}/.local/share/backgrounds"
        state: directory
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        mode: "0755"

    - name: 02.98 Deploy RISng wallpaper from repository artifact
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../artifacts/BackgroundPic.png"
        dest: "{{ ssh_user_home }}/.local/share/backgrounds/BackgroundPic.png"
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        mode: "0644"

    - name: 02.98 Determine deployed RISng commit from RISng checkouts
      ansible.builtin.shell: |
        set -euo pipefail
        for repo in \
          "{{ playbook_dir }}/../.." \
          "{{ lookup('ansible.builtin.env', 'HOME') }}/risng" \
          "/home/{{ ansible_env.SUDO_USER | default('', true) }}/risng" \
          "/home/risng/risng" \
          "{{ ssh_user_home }}/risng"
        do
          [ -d "$repo/.git" ] || continue
          if out="$(git -C "$repo" log -1 --pretty=format:%h 2>/dev/null)" && [ -n "$out" ]; then
            echo "$out"
            exit 0
          fi
        done
        exit 0
      args:
        executable: /bin/bash
      register: risng_git_commit
      changed_when: false
      failed_when: false

    - name: 02.98 Determine deployed RISng branch from RISng checkouts
      ansible.builtin.shell: |
        set -euo pipefail
        for repo in \
          "{{ playbook_dir }}/../.." \
          "{{ lookup('ansible.builtin.env', 'HOME') }}/risng" \
          "/home/{{ ansible_env.SUDO_USER | default('', true) }}/risng" \
          "/home/risng/risng" \
          "{{ ssh_user_home }}/risng"
        do
          [ -d "$repo/.git" ] || continue
          if out="$(git -C "$repo" rev-parse --abbrev-ref HEAD 2>/dev/null)" && [ -n "$out" ]; then
            echo "$out"
            exit 0
          fi
        done
        exit 0
      args:
        executable: /bin/bash
      register: risng_git_branch
      changed_when: false
      failed_when: false

    - name: 02.98 Build risng wallpaper timestamp label (UTC)
      ansible.builtin.command:
        argv:
          - date
          - -u
          - "+%F %H:%M:%S UTC"
      register: risng_wallpaper_timestamp
      changed_when: false

    - name: 02.98 Compose risng wallpaper annotation label
      ansible.builtin.set_fact:
        risng_wallpaper_label: >-
          Controlhost RISng - staged on {{ risng_wallpaper_timestamp.stdout | default('timestamp unavailable', true) }}
          (git-commit: {{ risng_git_commit.stdout | default('unknown', true) | trim | default('unknown') }} [branch {{ risng_git_branch.stdout | default('unknown', true) | trim | default('unknown') }}])
      changed_when: false

    - name: 02.98 Annotate RISng wallpaper with timestamp
      ansible.builtin.shell: |
        set -euo pipefail
        mogrify \
          -gravity north \
          -pointsize 36 \
          -fill '#FFFFFF' \
          -undercolor '#000000B3' \
          -annotate +0+120 {{ risng_wallpaper_label | quote }} \
          {{ (ssh_user_home ~ '/.local/share/backgrounds/BackgroundPic.png') | quote }}
        chown "{{ ssh_user }}:{{ ssh_user }}" {{ (ssh_user_home ~ '/.local/share/backgrounds/BackgroundPic.png') | quote }}
      args:
        executable: /bin/bash
      when:
        - risng_wallpaper_label | default('') | length > 0

    - name: 02.98 Ensure system dconf profile directory exists for RISng wallpaper defaults
      ansible.builtin.file:
        path: /etc/dconf/profile
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: 02.98 Ensure system dconf profile is configured for RISng wallpaper defaults
      ansible.builtin.copy:
        dest: /etc/dconf/profile/user
        owner: root
        group: root
        mode: "0644"
        content: |
          user-db:user
          system-db:local

    - name: 02.98 Ensure dconf local defaults directory exists for RISng wallpaper
      ansible.builtin.file:
        path: /etc/dconf/db/local.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: 02.98 Configure GNOME wallpaper defaults for the RISng user
      ansible.builtin.copy:
        dest: /etc/dconf/db/local.d/00-risng-wallpaper
        owner: root
        group: root
        mode: "0644"
        content: |
          [org/gnome/desktop/background]
          picture-uri='file://{{ ssh_user_home }}/.local/share/backgrounds/BackgroundPic.png'
          picture-uri-dark='file://{{ ssh_user_home }}/.local/share/backgrounds/BackgroundPic.png'
          picture-options='zoom'

    - name: 02.98 Update dconf database for RISng wallpaper defaults
      ansible.builtin.command:
        argv:
          - /usr/bin/dconf
          - update
      changed_when: false

    - name: 02.98 Apply RISng wallpaper to the prepared GNOME user profile
      ansible.builtin.shell: |
        set -euo pipefail
        if command -v gsettings >/dev/null 2>&1 && command -v dbus-run-session >/dev/null 2>&1; then
          runuser -u "{{ ssh_user }}" -- dbus-run-session gsettings set org.gnome.desktop.background picture-uri "file://{{ ssh_user_home }}/.local/share/backgrounds/BackgroundPic.png"
          runuser -u "{{ ssh_user }}" -- dbus-run-session gsettings set org.gnome.desktop.background picture-uri-dark "file://{{ ssh_user_home }}/.local/share/backgrounds/BackgroundPic.png"
        fi
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
